<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Plyo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09152A;
      --surface: #0F1E38;
      --accent: #D4F84A;
      --text: #E2EAF5;
      --muted: #4D6A8A;
      --border: #1C2F4A;
      color-scheme: dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #09152A; }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 1rem;
      letter-spacing: 0.12em;
      color: var(--accent);
    }
    .day-badge {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.1em;
    }
    .hero {
      padding: 3rem 2rem 2.25rem;
      border-bottom: 1px solid var(--border);
    }
    .workout-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.18em;
      margin-bottom: 0.6rem;
    }
    .workout-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: clamp(3.5rem, 11vw, 7.5rem);
      line-height: 0.88;
      color: var(--text);
      text-transform: uppercase;
      margin-bottom: 1.75rem;
    }
    .workout-name span { color: var(--accent); }
    .hero-meta { display: flex; gap: 2.5rem; flex-wrap: wrap; }
    .meta-item { display: flex; flex-direction: column; gap: 0.2rem; }
    .meta-label {
      font-size: 0.65rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.12em;
    }
    .meta-value {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }
    .section {
      padding: 2rem;
      border-bottom: 1px solid var(--border);
    }
    .section-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.18em;
      margin-bottom: 1.25rem;
    }
    .warmup-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .warmup-item {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.45rem 0.875rem;
      font-size: 0.825rem;
      color: var(--text);
      border-radius: 2px;
    }
    .exercise {
      display: grid;
      grid-template-columns: 2.75rem 1fr auto;
      gap: 1rem;
      align-items: start;
      padding: 1.375rem 0;
      border-bottom: 1px solid var(--border);
    }
    .exercise:last-child { border-bottom: none; }
    .exercise-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 1.75rem;
      color: var(--border);
      line-height: 1;
      padding-top: 0.1rem;
    }
    .exercise-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.4rem;
      color: var(--text);
      line-height: 1.1;
      margin-bottom: 0.35rem;
    }
    .exercise-cue {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.5;
      max-width: 42ch;
    }
    .exercise-stats {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.25rem;
      white-space: nowrap;
      padding-top: 0.1rem;
    }
    .stat-main {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--accent);
    }
    .stat-rest { font-size: 0.72rem; color: var(--muted); }
    .footer {
      padding: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .countdown-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.15em;
      margin-bottom: 0.25rem;
    }
    .countdown-time {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.05em;
    }
    .footer-note {
      font-size: 0.72rem;
      color: var(--muted);
      text-align: right;
      line-height: 1.6;
    }
    @media (max-width: 480px) {
      .topbar, .hero, .section, .footer { padding-left: 1.25rem; padding-right: 1.25rem; }
      .hero-meta { gap: 1.5rem; }
      .exercise { grid-template-columns: 2.25rem 1fr auto; gap: 0.625rem; }
      .exercise-name { font-size: 1.2rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="logo">DAILY PLYO</div>
  <div class="day-badge" id="day-badge"></div>
</header>

<section class="hero">
  <div class="workout-label">TODAY'S WORKOUT</div>
  <h1 class="workout-name" id="workout-name"></h1>
  <div class="hero-meta">
    <div class="meta-item">
      <span class="meta-label">DATE</span>
      <span class="meta-value" id="date-display"></span>
    </div>
    <div class="meta-item">
      <span class="meta-label">FOCUS</span>
      <span class="meta-value" id="focus-display"></span>
    </div>
    <div class="meta-item">
      <span class="meta-label">INTENSITY</span>
      <span class="meta-value" id="intensity-display"></span>
    </div>
    <div class="meta-item">
      <span class="meta-label">EST. TIME</span>
      <span class="meta-value" id="time-display"></span>
    </div>
  </div>
</section>

<section class="section">
  <div class="section-title">WARM-UP — 5 MIN</div>
  <div class="warmup-list" id="warmup-list"></div>
</section>

<section class="section">
  <div class="section-title">WORKOUT</div>
  <div id="exercise-list"></div>
</section>

<footer class="footer">
  <div>
    <div class="countdown-label">NEXT WORKOUT IN</div>
    <div class="countdown-time" id="countdown">--:--:--</div>
  </div>
  <div class="footer-note">
    New workout every day at midnight<br>
    Seeded by today's date — same for everyone
  </div>
</footer>

<script>
// Seeded PRNG so everyone gets the same workout on the same date
function cyrb128(str) {
  let h1=1779033703, h2=3144134277, h3=1013904242, h4=2773480762;
  for (let i=0,k; i<str.length; i++) {
    k=str.charCodeAt(i);
    h1=h2^Math.imul(h1^k,597399067); h2=h3^Math.imul(h2^k,2869860233);
    h3=h4^Math.imul(h3^k,951274213); h4=h1^Math.imul(h4^k,2716044179);
  }
  h1=Math.imul(h3^(h1>>>18),597399067); h2=Math.imul(h4^(h2>>>22),2869860233);
  h3=Math.imul(h1^(h3>>>17),951274213); h4=Math.imul(h2^(h4>>>19),2716044179);
  return [(h1^h2^h3^h4)>>>0,(h2^h1)>>>0,(h3^h1)>>>0,(h4^h1)>>>0];
}
function mulberry32(a) {
  return ()=>{ a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296; };
}
function makeRand(dateStr) {
  const [s]=cyrb128(dateStr); return mulberry32(s);
}

const workouts = [
  {
    name:["VERTICAL","POWER"], focus:"Lower Body", intensity:"High", time:"35–45 min",
    exercises:[
      {name:"Box Jumps",       sets:4, reps:"5",       rest:"90 sec", cue:"Land softly on mid-foot. Full reset and mental focus before each rep."},
      {name:"Depth Jumps",     sets:3, reps:"5",       rest:"2 min",  cue:"Step off the box — don't jump off. Minimize ground contact time."},
      {name:"Tuck Jumps",      sets:3, reps:"8",       rest:"75 sec", cue:"Drive knees to chest at peak height. Stay on balls of feet throughout."},
      {name:"Jump Squats",     sets:4, reps:"8",       rest:"60 sec", cue:"Full depth squat, then explode. Swing arms for extra momentum."},
      {name:"Single-Leg Hops", sets:3, reps:"6 each",  rest:"60 sec", cue:"Same leg takeoff and landing. Stick each rep before continuing."},
    ]
  },
  {
    name:["GROUND","ATTACK"], focus:"Horizontal Power", intensity:"High", time:"30–40 min",
    exercises:[
      {name:"Broad Jumps",          sets:4, reps:"5",       rest:"90 sec", cue:"Maximum horizontal distance. Stick the landing and hold for 2 seconds."},
      {name:"Bounding",             sets:4, reps:"20m",     rest:"90 sec", cue:"Exaggerated running strides. Drive the opposite arm hard on each push."},
      {name:"Lateral Bounds",       sets:4, reps:"6 each",  rest:"75 sec", cue:"Single-leg takeoff, single-leg landing. Absorb through hip and knee."},
      {name:"Split Jumps",          sets:3, reps:"8 each",  rest:"75 sec", cue:"Switch legs in the air. Land in a deep lunge, then immediately go again."},
      {name:"Skater Jumps",         sets:3, reps:"10 each", rest:"60 sec", cue:"Reach opposite hand to foot on landing. Fight the wobble on impact."},
    ]
  },
  {
    name:["FULL BODY","EXPLOSION"], focus:"Total Body", intensity:"Very High", time:"40–50 min",
    exercises:[
      {name:"Burpee Box Jumps",         sets:4, reps:"6",  rest:"90 sec", cue:"Flow directly from the burpee into the box jump — no pause at the floor."},
      {name:"Plyo Push-Ups",            sets:4, reps:"6",  rest:"75 sec", cue:"Push hard enough that your hands leave the floor. Catch with soft elbows."},
      {name:"Frog Jumps",               sets:3, reps:"8",  rest:"75 sec", cue:"Wide squat base. Jump forward and land right back into the squat position."},
      {name:"Medicine Ball Slams",      sets:4, reps:"10", rest:"60 sec", cue:"Full extension overhead before each slam. Drive it down with your whole core."},
      {name:"Hurdle Hops",              sets:3, reps:"10", rest:"60 sec", cue:"Quick ground contacts. Imagine the floor is too hot to stay on."},
    ]
  },
  {
    name:["LATERAL","QUICKNESS"], focus:"Agility & Lateral Power", intensity:"Medium", time:"30–35 min",
    exercises:[
      {name:"Lateral Box Shuffles",     sets:4, reps:"10 each", rest:"60 sec", cue:"Stay low throughout. Touch the box, don't plant and stand on it."},
      {name:"Skater Jumps",             sets:4, reps:"8 each",  rest:"60 sec", cue:"Wide lateral leap. Reach trailing arm toward the ground on landing."},
      {name:"Lateral Bounds",           sets:3, reps:"8 each",  rest:"75 sec", cue:"Push from the outside edge of your foot. Stick every single landing."},
      {name:"Side-to-Side Box Jumps",   sets:3, reps:"6 each",  rest:"90 sec", cue:"Land single-footed. Absorb the force through hip, knee, then ankle."},
      {name:"Shuffle + Bound",          sets:3, reps:"8 each",  rest:"75 sec", cue:"Three quick lateral shuffles, then one max-effort bound. Full reset after."},
    ]
  },
  {
    name:["REACTIVE","STRENGTH"], focus:"Stiffness & Spring", intensity:"High", time:"35–45 min",
    exercises:[
      {name:"Pogo Jumps",          sets:4, reps:"15",    rest:"60 sec", cue:"Stiff ankles, minimal knee bend. Think pogo stick — all ankle spring."},
      {name:"Depth Jumps to Box",  sets:4, reps:"5",     rest:"2 min",  cue:"Fastest possible ground contact. Land high on the box with control."},
      {name:"Double-Leg Bounds",   sets:3, reps:"6",     rest:"90 sec", cue:"Both feet together: jump, land, immediately jump again. No pause."},
      {name:"Ankle Hops",          sets:3, reps:"20",    rest:"45 sec", cue:"Zero knee bend. All propulsion comes from ankle plantar flexion only."},
      {name:"Box Jumps",           sets:4, reps:"5",     rest:"90 sec", cue:"Step down after each rep — never jump down. Treat every rep as a max effort."},
    ]
  },
  {
    name:["SPRINT","POWER"], focus:"Acceleration Mechanics", intensity:"High", time:"35–40 min",
    exercises:[
      {name:"Acceleration Bounds",     sets:4, reps:"30m",    rest:"90 sec", cue:"Low body angle, powerful push-back. Push the ground behind you, not down."},
      {name:"Jump Squats (paused)",     sets:4, reps:"6",      rest:"75 sec", cue:"Hold 2 seconds in the hole. Eliminate any countermovement, then explode."},
      {name:"Single-Leg Forward Hops", sets:3, reps:"8 each", rest:"75 sec", cue:"Drive your knee high on each hop. Cover as much ground as possible."},
      {name:"Standing Triple Jump",    sets:4, reps:"4",       rest:"90 sec", cue:"Hop → step → jump. Maintain forward lean and arm drive through each phase."},
      {name:"Broad Jumps",             sets:3, reps:"5",       rest:"90 sec", cue:"Arms back at takeoff, swing forward aggressively. Stick every landing."},
    ]
  },
  {
    name:["UPPER BODY","POWER"], focus:"Upper Body Explosiveness", intensity:"Medium", time:"30–35 min",
    exercises:[
      {name:"Clap Push-Ups",            sets:4, reps:"5",      rest:"75 sec", cue:"Explosive push, hands fully leave the floor. Catch with soft elbows."},
      {name:"Med Ball Chest Pass",      sets:4, reps:"8",      rest:"60 sec", cue:"Stand 1m from a wall. Full arm extension on every single rep."},
      {name:"Plyo Push-Up to Box",      sets:3, reps:"6",      rest:"90 sec", cue:"Push off floor hard, hands land on box. Step back down, don't jump down."},
      {name:"Med Ball Rotational Throw",sets:3, reps:"8 each", rest:"60 sec", cue:"Hips rotate first — arms just transmit the power. Catch and control."},
      {name:"Burpees",                  sets:3, reps:"8",      rest:"75 sec", cue:"Tight plank position. The jump at the top is a max-effort — reach for it."},
    ]
  },
  {
    name:["UNILATERAL","POWER"], focus:"Single-Leg Stability", intensity:"Medium-High", time:"35–40 min",
    exercises:[
      {name:"Single-Leg Box Jumps",     sets:3, reps:"5 each",  rest:"90 sec", cue:"Drive one knee up, one-leg takeoff and landing. Stick it for 2 seconds."},
      {name:"Pistol Squat Jumps",       sets:3, reps:"4 each",  rest:"90 sec", cue:"Partial pistol squat, then jump up off one leg. Land two-footed."},
      {name:"Skater Jumps",             sets:4, reps:"8 each",  rest:"60 sec", cue:"Lateral push from one leg, absorb on the other. Control before going back."},
      {name:"Single-Leg Bounding",      sets:3, reps:"20m each",rest:"90 sec", cue:"Same-leg hop series down 20m. Focus on hang time and forward drive."},
      {name:"Step-Up Jumps",            sets:3, reps:"6 each",  rest:"75 sec", cue:"Step up, drive through heel, explode into jump. Land soft, step back down."},
    ]
  },
];

const warmUps = [
  ["Leg swings × 10 each", "Hip circles × 10 each", "High knees × 20m", "Butt kicks × 20m", "Bodyweight squats × 10"],
  ["Jump rope or jog × 3 min", "Ankle circles × 10 each", "Walking lunges × 20m", "Arm circles", "Hip hinges × 10"],
  ["Light jog × 2 min", "World's greatest stretch × 5 each", "Lateral shuffles × 20m", "Inchworms × 5", "Glute bridges × 10"],
  ["Jumping jacks × 30", "Leg swings × 10 each", "Slow squat holds × 5", "Shoulder rolls × 10", "High knees × 30 sec"],
];

function getDayOfYear(d) {
  const start = new Date(d.getFullYear(), 0, 0);
  return Math.floor((d - start) / 86400000);
}

function render() {
  const now = new Date();
  const dateStr = now.toISOString().slice(0, 10);
  const rand = makeRand(dateStr);

  const w = workouts[Math.floor(rand() * workouts.length)];
  const warmup = warmUps[Math.floor(rand() * warmUps.length)];

  const day = getDayOfYear(now);
  document.getElementById('day-badge').textContent = 'DAY ' + day;

  const dateFormatted = now.toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });
  document.getElementById('date-display').textContent = dateFormatted;
  document.getElementById('focus-display').textContent = w.focus;
  document.getElementById('intensity-display').textContent = w.intensity;
  document.getElementById('time-display').textContent = w.time;

  // Workout name: first line in accent color
  const nameEl = document.getElementById('workout-name');
  nameEl.innerHTML = w.name.map((line, i) =>
    i === 0 ? `<span>${line}</span>` : line
  ).join('<br>');

  // Warmup
  const warmupEl = document.getElementById('warmup-list');
  warmup.forEach(item => {
    const div = document.createElement('div');
    div.className = 'warmup-item';
    div.textContent = item;
    warmupEl.appendChild(div);
  });

  // Exercises
  const listEl = document.getElementById('exercise-list');
  w.exercises.forEach((ex, i) => {
    const div = document.createElement('div');
    div.className = 'exercise';
    div.innerHTML = `
      <div class="exercise-num">${String(i+1).padStart(2,'0')}</div>
      <div>
        <div class="exercise-name">${ex.name}</div>
        <div class="exercise-cue">${ex.cue}</div>
      </div>
      <div class="exercise-stats">
        <div class="stat-main">${ex.sets} × ${ex.reps}</div>
        <div class="stat-rest">Rest ${ex.rest}</div>
      </div>`;
    listEl.appendChild(div);
  });
}

function updateCountdown() {
  const now = new Date();
  const midnight = new Date(now); midnight.setHours(24,0,0,0);
  const diff = midnight - now;
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  document.getElementById('countdown').textContent =
    `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

render();
updateCountdown();
setInterval(updateCountdown, 1000);
</script>
</body>
</html>
